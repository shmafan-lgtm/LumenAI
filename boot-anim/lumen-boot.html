<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen 开机动画</title>
<style>
  html,body{margin:0;height:100%;background:#020307;overflow:hidden}
  #c{display:block;width:100vw;height:100vh;cursor:none}
  #hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
        color:#5f7790;font:13px/1.4 -apple-system,Segoe UI,Roboto,"Microsoft YaHei",sans-serif;
        opacity:0;transition:opacity .3s;pointer-events:none;letter-spacing:.04em}
  body.showhint #hint{opacity:.75}
  #rec{position:fixed;right:18px;top:16px;z-index:9;cursor:pointer;
       background:rgba(20,30,42,.7);color:#cfe8ff;
       border:1px solid #2a445e;border-radius:8px;padding:8px 12px;font:14px -apple-system,"Microsoft YaHei",sans-serif}
  #rind{position:fixed;left:18px;top:18px;z-index:9;display:none;color:#ff6b6b;
        font:13px -apple-system,"Microsoft YaHei",sans-serif;letter-spacing:.05em}
  #rind::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;
        background:#ff4d4d;margin-right:7px;vertical-align:middle;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.25}}
  /* 录屏模式：隐藏一切 UI，确保画面干净 */
  body.rec #rec,body.rec #hint{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">空格 重播 · M 静音切换 · F 全屏 · 动画播完定格于 Logo · 右上角可录制 MP4</div>
<button id="rec">⏺ 录制 MP4</button>
<div id="rind">REC</div>
<script>
(function(){
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let W=0,H=0,DPR=1;
  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.floor(W*DPR); cv.height = Math.floor(H*DPR);
    cv.style.width = W+'px'; cv.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize); resize();

  const D = 9.0;
  let start = performance.now();
  let loop = false;
  let muted = true;

  const clamp=(x,a,b)=>x<a?a:x>b?b:x;
  const smooth=(e0,e1,x)=>{const t=clamp((x-e0)/(e1-e0),0,1);return t*t*(3-2*t);};
  const CYAN=[79,209,255], WHITE=[255,255,255], ACC=[123,224,255];

  const N=140;
  const P=[];
  for(let i=0;i<N;i++){
    const ang=Math.random()*Math.PI*2;
    const spd=0.4+Math.random()*0.9;
    P.push({ang, spd, r0:0.05+Math.random()*0.05, len:0.04+Math.random()*0.10,
            tw:Math.random()*Math.PI*2, sz:0.6+Math.random()*1.8, hue:Math.random()});
  }

  let actx=null, gain=null;
  function ensureAudio(){
    if(actx) return;
    try{
      actx=new (window.AudioContext||window.webkitAudioContext)();
      gain=actx.createGain(); gain.gain.value=0; gain.connect(actx.destination);
      [110,164.81,220].forEach((f,i)=>{
        const o=actx.createOscillator(); o.type='sine'; o.frequency.value=f;
        const g=actx.createGain(); g.gain.value=[0.5,0.3,0.2][i];
        o.connect(g); g.connect(gain); o.start();
      });
    }catch(e){ actx=null; }
  }
  function audioGain(t){
    if(!actx||muted) return;
    const g=smooth(1.0,4.5,t)*0.12;
    try{ gain.gain.setTargetAtTime(g, actx.currentTime, 0.3); }catch(e){}
  }

  function frame(now){
    const t = ((now-start)/1000);
    const tt = loop ? (t % D) : Math.min(t, D);

    ctx.clearRect(0,0,W,H);
    const bg=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.75);
    bg.addColorStop(0,'#070b12'); bg.addColorStop(1,'#020307');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

    const cx=W/2, cy=H/2;
    const baseR=Math.min(W,H)*0.22;

    const coreI=smooth(0.0,1.4,tt);
    const pulse=1+0.04*Math.sin(tt*2.0);
    const coreR=baseR*(0.10+0.16*coreI)*pulse;
    const coreGlow=ctx.createRadialGradient(cx,cy,0,cx,cy,baseR*1.6);
    coreGlow.addColorStop(0,`rgba(255,255,255,${0.95*coreI})`);
    coreGlow.addColorStop(0.18,`rgba(${CYAN[0]},${CYAN[1]},${CYAN[2]},${0.6*coreI})`);
    coreGlow.addColorStop(1,`rgba(${CYAN[0]},${CYAN[1]},${CYAN[2]},0)`);
    ctx.fillStyle=coreGlow;
    ctx.beginPath(); ctx.arc(cx,cy,baseR*1.6,0,Math.PI*2); ctx.fill();

    const rayI=smooth(1.2,3.2,tt)*(1-smooth(4.0,6.0,tt));
    if(rayI>0.001){
      ctx.save(); ctx.translate(cx,cy); ctx.rotate(tt*0.25);
      const rays=16;
      for(let i=0;i<rays;i++){
        ctx.rotate((Math.PI*2)/rays);
        const lg=ctx.createLinearGradient(0,0,0,-baseR*2.4);
        lg.addColorStop(0,`rgba(255,255,255,0)`);
        lg.addColorStop(0.5,`rgba(${ACC[0]},${ACC[1]},${ACC[2]},${0.22*rayI})`);
        lg.addColorStop(1,`rgba(${CYAN[0]},${CYAN[1]},${CYAN[2]},0)`);
        ctx.strokeStyle=lg; ctx.lineWidth=1.4;
        ctx.beginPath(); ctx.moveTo(0,-baseR*0.5); ctx.lineTo(0,-baseR*2.4); ctx.stroke();
      }
      ctx.restore();
    }

    const out=smooth(1.4,3.6,tt);
    const inw=smooth(3.4,5.4,tt);
    const settle=smooth(5.2,7.0,tt);
    ctx.save(); ctx.translate(cx,cy);
    for(let i=0;i<N;i++){
      const p=P[i];
      let r;
      if(out<1) r = baseR*(p.r0 + (0.9*(1-inw)+0.0)*out*1.6);
      else r = baseR*(p.r0 + 1.6*(1-inw) + (inw)*(0.62));
      let a=p.ang + tt*0.15*(0.3+settle);
      const x=Math.cos(a)*r, y=Math.sin(a)*r;
      const tw=0.5+0.5*Math.sin(tt*3+p.tw);
      const alpha=(0.25+0.6*tw)*Math.max(out,settle)*coreI;
      const col = p.hue<0.7?CYAN:WHITE;
      ctx.fillStyle=`rgba(${col[0]},${col[1]},${col[2]},${clamp(alpha,0,1)})`;
      ctx.beginPath(); ctx.arc(x,y,p.sz*(0.6+0.6*coreI),0,Math.PI*2); ctx.fill();
    }
    ctx.restore();

    const ringI=smooth(3.6,5.6,tt);
    if(ringI>0.001){
      ctx.save(); ctx.translate(cx,cy); ctx.rotate(tt*0.4);
      ctx.lineWidth=2.2*ringI;
      ctx.shadowColor=`rgba(${CYAN[0]},${CYAN[1]},${CYAN[2]},0.9)`;
      ctx.shadowBlur=22*ringI;
      const arc=Math.PI*2*ringI;
      const rg=ctx.createLinearGradient(-baseR,0,baseR,0);
      rg.addColorStop(0,`rgba(${CYAN[0]},${CYAN[1]},${CYAN[2]},0.15)`);
      rg.addColorStop(0.5,`rgba(${WHITE[0]},${WHITE[1]},${WHITE[2]},0.95)`);
      rg.addColorStop(1,`rgba(${CYAN[0]},${CYAN[1]},${CYAN[2]},0.15)`);
      ctx.strokeStyle=rg;
      ctx.beginPath(); ctx.arc(0,0,baseR*0.62,0,arc); ctx.stroke();
      ctx.restore();
    }

    const reveal=smooth(5.4,7.2,tt);
    const breathe=1+0.03*Math.sin(tt*2.2);
    if(reveal>0.001){
      ctx.save(); ctx.translate(cx,cy); ctx.scale(breathe,breathe);
      ctx.globalAlpha=reveal;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.shadowColor=`rgba(${CYAN[0]},${CYAN[1]},${CYAN[2]},0.8)`;
      ctx.shadowBlur=24*reveal;
      ctx.fillStyle='#eaf6ff';
      const lw=Math.min(W*0.09, 92);
      ctx.font=`600 ${lw}px -apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif`;
      ctx.fillText('Lumen', 0, -baseR*0.06);
      ctx.shadowBlur=8*reveal;
      ctx.fillStyle=`rgba(150,200,235,${0.85*reveal})`;
      const sw=Math.min(W*0.026, 26);
      ctx.font=`400 ${sw}px -apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif`;
      ctx.fillText('正在点亮…', 0, baseR*0.30);
      ctx.restore();
    }

    const vig=ctx.createRadialGradient(cx,cy,baseR*1.2,cx,cy,Math.max(W,H)*0.7);
    vig.addColorStop(0,'rgba(0,0,0,0)'); vig.addColorStop(1,'rgba(0,0,0,0.55)');
    ctx.fillStyle=vig; ctx.fillRect(0,0,W,H);

    audioGain(tt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function replay(){ start=performance.now(); if(actx&&actx.state==='suspended')actx.resume(); }
  window.__lumenReplay = replay;

  window.addEventListener('keydown',e=>{
    if(e.code==='Space'){e.preventDefault(); replay();}
    else if(e.key==='m'||e.key==='M'){ muted=!muted; if(!muted){ensureAudio(); if(actx&&actx.state==='suspended')actx.resume();} }
    else if(e.key==='f'||e.key==='F'){ if(!document.fullscreenElement)document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
    else if(e.key==='h'||e.key==='H'){ document.body.classList.toggle('showhint'); }
  });
  window.addEventListener('click',()=>{ ensureAudio(); if(actx&&actx.state==='suspended')actx.resume(); });

  const q=new URLSearchParams(location.search);
  if(q.get('loop')==='1') loop=true;
  if(q.get('muted')==='0'){ muted=false; ensureAudio(); }
})();

/* ===== 一键录制 MP4（浏览器内置 MediaRecorder，无需 OBS） ===== */
(function(){
  const cv=document.getElementById('c');
  const btn=document.getElementById('rec');
  const ind=document.getElementById('rind');
  let rec=null, chunks=[], fps=60;
  function pickMime(){
    const cands=['video/mp4;codecs=avc1.42E01E','video/mp4','video/webm;codecs=vp9','video/webm'];
    for(const c of cands){ if(window.MediaRecorder && MediaRecorder.isTypeSupported(c)) return c; }
    return '';
  }
  function startRec(){
    if(rec && rec.state==='recording') return;
    let stream=cv.captureStream(fps);
    const mime=pickMime();
    try{ rec = mime ? new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:12000000}) : new MediaRecorder(stream); }
    catch(e){ rec=new MediaRecorder(stream); }
    chunks=[];
    rec.ondataavailable=e=>{ if(e.data && e.data.size) chunks.push(e.data); };
    rec.onstop=()=>{
      const type=rec.mimeType||'video/webm';
      const ext=type.indexOf('mp4')>=0?'mp4':'webm';
      const blob=new Blob(chunks,{type});
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download='lumen-boot.'+ext;
      document.body.appendChild(a); a.click(); a.remove();
      ind.style.display='none'; btn.textContent='⏺ 录制 MP4'; btn.style.display='';
    };
    rec.start();
    btn.textContent='● 录制中'; ind.style.display='block';
  }
  function stopRec(){ if(rec && rec.state==='recording'){ rec.stop(); } }
  btn.addEventListener('click',()=>{ if(rec&&rec.state==='recording') stopRec(); else startRec(); });
  const q=new URLSearchParams(location.search);
  if(q.get('rec')==='1'){
    document.body.classList.add('rec');
    setTimeout(()=>{ if(window.__lumenReplay) window.__lumenReplay(); startRec();
      setTimeout(()=>stopRec(), 9600); }, 400);
  }
})();
</script>
</body>
</html>
