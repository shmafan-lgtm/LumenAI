<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen</title>
<link rel="icon" href="/assets/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/assets/icon-192.png">
<link rel="manifest" href="/app.webmanifest">
<link rel="stylesheet" href="/assets/app.css">
<link rel="stylesheet" href="/assets/thinking.css">
<style>
  /* ===== Lumen 开机动画（纯内联 HTML/CSS/SVG，不依赖任何视频文件）=====
     视觉语言借鉴开源项目 dsh-550c-boot（MIT © Ziyang Song；片头原稿 Voidpocket，
     https://github.com/yannicksong0106/dsh-550c-boot）：黑底 + 扫描线 + 红色圆环 +
     逐笔书写 + 终端进度条。此处为独立重写，品牌与文案全部替换为 Lumen。
     之所以弃用 <video>：MP4 要过 autoplay 策略 / H.264 解码 / Range 三道关，
     任一失败就只剩白屏（用户实测「开机视频不播放」）。纯 CSS/SVG 无此问题。 */
  #intro {
    position: fixed; inset: 0; z-index: 99999;
    background: #050607; display: flex;
    align-items: center; justify-content: center;
    overflow: hidden; cursor: default; user-select: none;
    font-family:"Segoe UI","Microsoft YaHei UI",system-ui,sans-serif;
    opacity: 1; transition: opacity .5s ease;
  }
  #intro.out { opacity: 0; pointer-events: none; }
  #intro .scan {
    position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: repeating-linear-gradient(to bottom,
      rgba(255,255,255,.035) 0, rgba(255,255,255,.035) 1px,
      transparent 1px, transparent 4px);
    animation: scanIn .8s ease forwards;
  }
  @keyframes scanIn { to { opacity: 1; } }
  #intro .vig {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 44%, transparent 28%, rgba(0,0,0,.8) 100%);
  }
  #intro .stage {
    position: relative; display: flex; flex-direction: column;
    align-items: center; gap: 30px; padding: 0 24px;
  }
  /* 红色圆环：呼应 550C 里那枚红色的 0 */
  .ringwrap { position: relative; width: 128px; height: 128px; }
  .ringwrap svg {
    width: 100%; height: 100%; transform: rotate(-90deg);
    transform-origin: 50% 50%; animation: ringSpin 9s linear infinite;
  }
  @keyframes ringSpin { to { transform: rotate(270deg); } }
  .ring-track { fill: none; stroke: rgba(255,255,255,.09); stroke-width: 2; }
  .ring-prog {
    fill: none; stroke: #ff3b30; stroke-width: 2.6; stroke-linecap: round;
    stroke-dasharray: 327; stroke-dashoffset: 327;
    filter: drop-shadow(0 0 7px rgba(255,59,48,.85));
    animation: ringDraw 3.2s cubic-bezier(.4,0,.2,1) .3s forwards;
  }
  @keyframes ringDraw { to { stroke-dashoffset: 0; } }
  .ringwrap::after {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%;
    background: #ff5a4d; box-shadow: 0 0 14px 3px rgba(255,59,48,.7);
    animation: core 1.7s ease-in-out infinite;
  }
  @keyframes core { 0%,100% { opacity:.4; transform:scale(.8); } 50% { opacity:1; transform:scale(1.35); } }
  /* LUMEN 逐字书写 */
  .wordmark {
    display: flex; gap: .04em; font-weight: 200; letter-spacing: .04em;
    font-size: clamp(38px, 7vw, 74px); line-height: 1; color: #f2f4f7;
    animation: glow 2.8s ease-in-out 2s infinite;
  }
  @keyframes glow {
    0%,100% { filter: drop-shadow(0 0 8px rgba(255,255,255,.14)); }
    50%     { filter: drop-shadow(0 0 22px rgba(255,255,255,.42)); }
  }
  .wordmark span {
    display: inline-block; opacity: 0;
    clip-path: inset(0 100% 0 0); -webkit-clip-path: inset(0 100% 0 0);
  }
  .wordmark span:nth-child(1){ animation: write .6s cubic-bezier(.4,0,.2,1) .55s both; }
  .wordmark span:nth-child(2){ animation: write .6s cubic-bezier(.4,0,.2,1) .77s both; }
  .wordmark span:nth-child(3){ animation: write .6s cubic-bezier(.4,0,.2,1) .99s both; }
  .wordmark span:nth-child(4){ animation: write .6s cubic-bezier(.4,0,.2,1) 1.21s both; }
  .wordmark span:nth-child(5){ animation: write .6s cubic-bezier(.4,0,.2,1) 1.43s both; }
  @keyframes write {
    0%   { opacity: .12; clip-path: inset(0 100% 0 0); -webkit-clip-path: inset(0 100% 0 0); }
    100% { opacity: 1;   clip-path: inset(0 0 0 0);    -webkit-clip-path: inset(0 0 0 0); }
  }
  /* 终端进度区 */
  .bootrow { width: min(430px, 82vw); display: flex; flex-direction: column; gap: 11px; }
  .bootmeta {
    display: flex; justify-content: space-between;
    font: 11px/1.4 "JetBrains Mono",Consolas,monospace; letter-spacing: .26em;
    color: rgba(255,255,255,.42);
  }
  .bootbar { height: 2px; background: rgba(255,255,255,.10); overflow: hidden; }
  .bootbar i {
    display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, #8a1a12, #ff3b30);
    box-shadow: 0 0 10px rgba(255,59,48,.7);
    animation: fill 3.6s cubic-bezier(.4,0,.2,1) .3s forwards;
  }
  @keyframes fill { to { width: 100%; } }
  .boottext {
    font: 11px/1.4 "JetBrains Mono",Consolas,monospace; letter-spacing: .16em;
    color: rgba(255,255,255,.5); min-height: 1.4em;
  }
  .boottext .cur {
    display: inline-block; width: 6px; height: 11px; background: #ff3b30;
    margin-left: 7px; vertical-align: -1px; animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
</style>
</head>
<body>
<!-- 开机动画：全屏不可跳过，播完才进入客户端（纯内联，无视频依赖） -->
<div id="intro">
  <div class="scan"></div>
  <div class="vig"></div>
  <div class="stage">
    <div class="ringwrap">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="ring-track" cx="60" cy="60" r="52"></circle>
        <circle class="ring-prog"  cx="60" cy="60" r="52"></circle>
      </svg>
    </div>
    <div class="wordmark" aria-label="LUMEN">
      <span>L</span><span>U</span><span>M</span><span>E</span><span>N</span>
    </div>
    <div class="bootrow">
      <div class="bootmeta"><span>LOCAL ENGINE</span><span>v1.0.0</span></div>
      <div class="bootbar"><i></i></div>
      <div class="boottext"><span id="bootType"></span><span class="cur"></span></div>
    </div>
  </div>
</div>
<script>
(function () {
  var intro = document.getElementById('intro');
  if (!intro) return;
  var revealed = false;
  function reveal() {
    if (revealed) return;
    revealed = true;
    intro.classList.add('out');
    setTimeout(function () {
      if (intro && intro.parentNode) intro.parentNode.removeChild(intro);
    }, 520);
  }
  // 不可跳过：拦截遮罩上的全部交互
  ['click', 'dblclick', 'contextmenu', 'keydown', 'keyup', 'mousedown',
   'mouseup', 'touchstart', 'touchmove', 'wheel'].forEach(function (ev) {
    intro.addEventListener(ev, function (e) { e.preventDefault(); e.stopPropagation(); }, true);
  });
  // 打字机文案（纯展示，失败也不影响动画与进入客户端）
  var txt = 'LUMEN SYSTEM BOOT // LOCAL ENGINE ONLINE';
  var el = document.getElementById('bootType'), i = 0;
  (function type() {
    if (!el) return;
    if (i <= txt.length) { el.textContent = txt.slice(0, i++); setTimeout(type, 42); }
  })();
  // 动画总长约 4.2s；另设 9s 硬兜底，任何异常都不会把用户卡在黑屏
  setTimeout(reveal, 4200);
  setTimeout(reveal, 9000);
})();
</script>
<div id="boot" class="boot"><img class="boot-mark" src="/assets/logo.png" alt=""><div class="boot-text">Lumen 正在点亮…</div></div>

<div class="app" id="app" hidden>
  <aside class="sidebar">
    <div class="brand">
      <img class="brand-mark" src="/assets/logo.png" alt="Lumen">
      <div class="brand-txt"><strong>Lumen</strong><span id="brandSub">本地 AI 工作台</span></div>
      <button class="icon-btn" id="btnCollapse" title="收起侧栏">
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
    </div>

    <button class="new-chat" id="btnNew">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      <span>新对话</span>
      <kbd>Ctrl N</kbd>
    </button>

    <div class="side-label">会话</div>
    <div class="session-list" id="sessionList"></div>

    <div class="side-foot">
      <button class="side-item" id="btnPanel" data-panel="settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-1.8-.3 1.6 1.6 0 00-1 1.5V21a2 2 0 11-4 0v-.1A1.6 1.6 0 008 19.4a1.6 1.6 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1H2a2 2 0 110-4h.1A1.6 1.6 0 004.6 8a1.6 1.6 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 001.8.3H9a1.6 1.6 0 001-1.5V2a2 2 0 114 0v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8V9a1.6 1.6 0 001.5 1H22a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z"/></svg>
        <span>设置</span>
      </button>
      <button class="side-item" id="btnPhone">
        <svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18.5h2"/></svg>
        <span>手机同步 / 远控</span>
        <em class="dot" id="phoneDot"></em>
      </button>
      <button class="side-item" id="btnAbout">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>
        <span>关于</span>
      </button>
      <div class="hw-mini" id="hwMini"></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="model-pill" id="modelPill">
        <span class="mp-dot" id="mpDot"></span>
        <span class="mp-name" id="mpName">Lumen H1 Turbo</span>
        <span class="mp-meta" id="mpMeta">Q4_K_M · 16K</span>
        <svg viewBox="0 0 24 24" class="mp-caret"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="topbar-mid">
        <span class="tag" id="engTag">检测中</span>
        <span class="tag ghost" id="agentTag">Agent</span>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" id="btnSearchToggle" title="联网搜索">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
        </button>
        <button class="icon-btn" id="btnExplore" title="检索面板">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>
        </button>
        <button class="icon-btn" id="btnMore" title="更多">
          <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
        </button>
      </div>
    </header>

    <section class="stage" id="stage">
      <div class="welcome" id="welcome">
        <div class="welcome-glow"></div>
        <img class="welcome-mark" src="/assets/logo.png" alt="Lumen">
        <h1>你的电脑，现在会思考了</h1>
        <p id="welcomeSub">全部推理在本机完成，文件与命令不出这台机器。</p>
        <div class="prompt-cards" id="promptCards"></div>
        <div class="welcome-hw" id="welcomeHw"></div>
      </div>
      <div class="thread" id="thread"></div>
    </section>

    <footer class="composer-wrap">
      <div class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="问点什么，或者让它直接动手改代码…（Enter 发送 / Shift+Enter 换行）"></textarea>
        <div class="composer-bar">
          <div class="cb-left">
            <button class="chip" id="chipAgent" data-on="1">
              <svg viewBox="0 0 24 24"><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="4"/></svg>
              <span>Agent</span>
            </button>
            <button class="chip" id="chipSearch" data-on="1">
              <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
              <span>联网</span>
            </button>
            <button class="chip" id="chipWork" title="打开工作区目录">
              <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
              <span>工作区</span>
            </button>
          </div>
          <div class="cb-right">
            <span class="tok" id="ctxHint">8K 上下文</span>
            <button class="send" id="btnSend" title="发送">
              <svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 8 6 8z"/></svg>
            </button>
          </div>
        </div>
      </div>
      <div class="composer-tip" id="composerTip">本地推理 · 断网可用 · 工具调用需你确认</div>
    </footer>
  </main>

  <aside class="drawer" id="drawer" hidden>
    <div class="drawer-head">
      <div class="drawer-tabs" id="drawerTabs">
        <button class="dtab on" data-tab="settings">设置</button>
        <button class="dtab" data-tab="phone">手机</button>
        <button class="dtab" data-tab="guard">守护</button>
        <button class="dtab" data-tab="about">关于</button>
      </div>
      <button class="icon-btn" id="drawerClose"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>
</div>

<div class="modal-root" id="modalRoot"></div>
<div class="toast-root" id="toastRoot"></div>

<script id="lumen-boot" type="application/json">__LUMEN_BOOT__</script>
<script src="/assets/qrcode.js"></script>
<script src="/assets/app.js"></script>
</body>
</html>
