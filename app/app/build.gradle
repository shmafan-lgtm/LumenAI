plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lumen.remote'
    compileSdk 34

    defaultConfig {
        applicationId "com.lumen.remote"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        resConfigs "zh", "zh-rCN", "en"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 用 debug 签名，保证任何人都能直接安装体验；正式上架再换成自己的签名
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*']
        }
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            output.outputFileName = "Lumen-${variant.name}-v${variant.versionName}.apk"
        }
    }
}

dependencies {
    // 不引第三方 UI 框架：原生 Activity + WebView，减少 APK 体积与供应链面
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.annotation:annotation:1.8.2'
}
