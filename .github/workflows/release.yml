name: 构建与发布

# 打 v* 标签时自动构建 Windows 桌面端 + 手机 APP，并挂到 GitHub Releases。
# 手动触发（workflow_dispatch）只构建、不发布，方便验证流水线。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows 桌面端
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装打包依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # ONNX 兜底引擎可选：装不上也不影响主路径（内置 llama.cpp Vulkan）
          pip install onnxruntime onnxruntime-genai

      - name: 准备 llama.cpp 运行时
        shell: pwsh
        run: |
          if (!(Test-Path runtime/llamacpp/llama-server.exe)) {
            Write-Host '解压内置 Vulkan 运行时...'
            Expand-Archive -Path runtime/llamacpp-vulkan.zip -DestinationPath runtime -Force
          }
          Get-ChildItem runtime/llamacpp | Select-Object -First 5 Name

      - name: 打包 Lumen.exe
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build build.spec

      - name: 打包 LumenGuard.exe
        run: python -m PyInstaller --noconfirm --clean --distpath distguard --workpath buildguard guard.spec

      - name: 制作发行压缩包
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Lumen -DestinationPath Lumen-Windows-x64.zip -Force
          Compress-Archive -Path distguard/LumenGuard -DestinationPath LumenGuard-Windows-x64.zip -Force
          Get-ChildItem *.zip | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: lumen-windows
          path: |
            Lumen-Windows-x64.zip
            LumenGuard-Windows-x64.zip

  android:
    name: 手机 APP（APK）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: 构建 APK
        working-directory: app
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: lumen-android
          path: app/app/build/outputs/apk/release/*.apk

  release:
    name: 发布到 GitHub Releases
    needs: [windows, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 写发布说明
        run: |
          {
            echo "## 下载"
            echo
            echo "| 文件 | 用途 |"
            echo "|---|---|"
            echo "| \`Lumen-Windows-x64.zip\` | 桌面端主程序（解压即用） |"
            echo "| \`LumenGuard-Windows-x64.zip\` | 守护服务（崩溃自动拉起） |"
            echo "| \`Lumen-release-v*.apk\` | 手机端 APP |"
            echo
            echo "权重不在安装包里：首次启动后按所选档位自动下载（走国内镜像）。"
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
